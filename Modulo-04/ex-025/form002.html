<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio formulario 02</title>
</head>
<body>
    <h1>Teste de Formularios</h1>
    <form action="cadastro.php" method="post">
    <p>
        <label for="iusu">Usuario</label>
        <input type="text" name="usu" id="iusu" required minlength="6" maxlength="15" size="30" placeholder="Digite usuario" autocomplete="on">
    </p>

    <p>
        <label for="isenha">Senha</label>
        <input type="password" name="senha" id="isenha" required minlength="4" maxlength="8" size="20" placeholder="digite sua senha" autocomplete="off">
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar Dados">
    </p>
    </form>
    
</body>
</html>
