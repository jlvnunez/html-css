<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio formulario 04</title>
</head>
<body>
    <h1>Exemplo de Formulario 04</h1>
    <form action="cadastro.php" method="get">
    <fieldset>
        <p>
            <legend>Dados Pessoais</legend>
            <label for="iemail">E-mail</label>
            <input type="email" name="email" id="iemail" autocomplete="email" required>
        </p>
        <p>
            <label for="itelefone">Telefone</label>
            <input type="tel" name="telefone" id="itelefone" autocomplete="tel" pattern="^\(\d{2}\)\d{5}-\d{4}"$ required placeholder="(xx)xxxxx-xxxx" >
        </p>
    </fieldset>

     <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
     </p>

    </form>
</body>
</html>
