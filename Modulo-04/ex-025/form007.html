<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio formulario 07</title>
</head>
<body>
    <h1>Exemplo de Formulario 07</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iestado">Estado</label>
            <select name="estado" id="iestado">
               
               <option value="" selected>---Escolha---</option>
                <optgroup label="Regiao Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">Sao Paulo</option>
                </optgroup>

                <optgroup label="Regiao Nordeste">
                    <option value="MA">Maranhao</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">R. grande do</option>
                </optgroup>

            </select>
        </p>

        <p>
            <label for="iprof">Profissao</label>
            <input type="text" name="prof" id="iprof" list="listprofissao">
            <datalist id="listprofissao">
                <option>Administrador</option>
                <option>Engenheiro</option>
                <option>Arquiteto</option>
                <option>Desenvolvedor</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem:</label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Digite sua Mensagem aqui!"></textarea>
        </p>
       
    

     <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
     </p>

    </form>
</body>
</html>
