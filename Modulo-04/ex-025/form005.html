<body>
    <h1>Exemplo de Formulario 05</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imasculino" value="M" checked><label for="imasculino">Masculino</label>
            <input type="radio" name="sexo" id="ifeminino" value="F"><label for="ifeminino">
                Feminino
              </label>       
            </fieldset>
           
        
        <fieldset>
            <legend>Esportes Favoritos</legend>
           <input type="checkbox" name="basquete" id="ibasquete"><label for="ibasquete">Basquete</label> <br>
           <input type="checkbox" name="futebol" id="ifutebol"><label for="ifutebol">Futebol</label>  <br>    
           <input type="checkbox" name="natacao" id="inatacao"><label for="inatacao">Natacao</label> <br>
           <input type="checkbox" name="tenis" id="itenis"><label for="itenis">Tenis</label> <br>


        </fieldset>
    

     <p>

            <input type="reset" value="Limpar">
     </p>

    </form>
