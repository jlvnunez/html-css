<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos Grid-Areas exercicio free</title>
    <style>
        


    .container {
   
    background-color: black;
    text-align: center;
    font-weight: bold;
    font-size: x-large;
    display: grid;
    grid-template-rows: repeat(3,100px);
    grid-template-columns: repeat(4,1fr);
    gap: 5px;

}

.caixa1 {

    background-color: red;
    grid-row-start: 1;
    grid-row-end: 4;
    grid-column-start: -5;
    grid-column-end:-4;
    
}
   .caixa2{
    background-color: green;
    grid-row-start:1 ;
    grid-row-end: 4;
    grid-column-start:2 ;
    grid-column-end:4 ;


 }

  .caixa3{
    background-color:blue;
    grid-row-start: 1;
    grid-row-end:4 ;
    grid-column-start:4 ;
    grid-column-end:5 ;
 }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 01</div>
        <div class="caixa2">Caixa 02</div>
        <div class="caixa3">Caixa 03</div>





    </div>
    
</body>
</html>
