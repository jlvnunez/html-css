<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            border: 2px solid red;
        }

        tr{
            background-color: gray;
        }

        tr.linha{
            /* background-color: gray; */
        }
        td{
            border: 1px solid black;
            padding: 8px;
            border-collapse: collapse;
        }
        td.dado{
            background-color: yellow;
        }



    </style>
</head>
<body>
    <h1>Minha Primeita Tabela</h1>
    <!-- hierarquia de tabela (simples) 
       table =tabelas
            table row = lina de tabela 
              table header= cabecalho tabela 
                 table data = dado de tabela -->

                 <table>
                    <tr> <!--Primeira linha-->
                        <td>A1</td>
                        <td>B1</td>
                        <td>C1</td>                  
                    </tr>

                    <tr class="linha">
                         <td>A2</td>
                         <td>B2</td>
                         <td>C2</td>
                    </tr>

                        <tr>
                            <td>A3</td>
                            <td>B3</td>
                            <td>C3</td>
                        </tr>

                        <tr>
                             <td class="dado">A4</td>
                             <td>B4</td>
                             <td>C4</td>
                        </tr>

                       


                       

                    
                 </table>
</body>
</html>
