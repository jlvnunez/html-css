<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;  
            

        }

                
        
        td{
            border: 1px solid black;
            padding: 8px;
            /* alinhamento horizontal */
            text-align: center;
            /* alinhamento vertical */
            /* vertical-align: top; */
            /* vertical-align: bottom; */
            vertical-align: middle;
            
        }
        td.numero{
            text-align: right;
        }
        



    </style>
</head>
<body>
    <h1>Minha Primeita Tabela</h1>
    <!-- hierarquia de tabela (simples) 
       table =tabelas
            table row = lina de tabela 
              table header= cabecalho tabela 
                 table data = dado de tabela -->

                 <table>
                    <tr> <!--Primeira linha-->
                        <td>A1</td>
                        <td>B1</td>
                        <td>C1</td>                  
                    </tr>

                    <tr>
                         <td>A2</td>
                         <td>B2</td>
                         <td class="numero">C2</td>
                    </tr>

                        <tr>
                            <td>A3</td>
                            <td>B3</td>
                            <td class="numero">C3</td>
                        </tr>

                        <tr>
                             <td>A4</td>
                             <td>B4</td>
                             <td>C4</td>
                        </tr>

                       


                       

                    
                 </table>
</body>
</html>
